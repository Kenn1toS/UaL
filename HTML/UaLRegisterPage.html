<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="shortcut icon" href="../Sours/Без имени.png" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/UaLRegisterPage.css">
    <link rel="stylesheet" href="../CSS/Reset_style.css">
    <title>UaL</title>
</head>
<body>
    <h1 class="titleREG" id="titleText">UaL</h1>

    
    <div class="containerREG"> 
        <form onsubmit=" return checkForm(this)" method="post">
            <div class="borderContainerSearch">
                <div class="containerSearch">
                    <div id="searchButtonLogin" class="searchButton"></div>
                    <input name="login" class="search" type="text" id="login" placeholder="логін">
                </div>
            <p class="warning" id="warningLogin"></p>
            </div>
            <div class="borderContainerSearch">
                <div class="containerSearch">
                    <div id="searchButtonPassword"  class="searchButton"></div>
                    <input name="password" class="search" type="text" id="password" placeholder="пароль">
                </div>
            <p class="warning" id="warningPassword"></p>
        </div>
        <div id="searchContainer">
            
        </div>
        <div class="containerHelp">
            <a href="" id="addSearchButton">Регестрація</a>
            <a href="" id="removeLink">Не можу зайти</a>
        </div>
        
        <button type="submit" class="Enter" id="Enter">Увійти</button>
        </form>
    </div>
    <div class="marquee-container">
        <div class="marquee">у розробці версія: B1</div>
    </div>
<script src="../JS/UaLRegisterPage.js"></script>
</body>
</html>
